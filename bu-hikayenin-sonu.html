<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bu Hikayenin Sonu - Dergi Okuyucu</title>
    <style>
        /* Temel Sayfa Düzeni */
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Başlık ve Uyarı Alanı */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 15px;
        }
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        .header p {
            font-size: 0.85rem;
            color: #888888;
            margin: 0;
        }

        /* Görsel Kapsayıcısı */
        .dergi-kapsayici {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: filter 0.15s ease, opacity 0.15s ease;
        }

        /* Görsellerin Yapısı */
        .dergi-sayfa {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        /* Ekran Alıntısı / Odak Kaybında Bulanıklaştırma Efekti */
        .blur-mode {
            filter: blur(30px) grayscale(100%);
            opacity: 0.05;
        }

        /* Telif Alt Bilgisi */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.75rem;
            color: #666666;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bu Hikayenin Sonu</h1>
        <p>Telif hakları saklıdır. Kopyalanamaz ve çoğaltılamaz.</p>
    </div>

    <!-- 2 Sayfalık Görsel Alanı -->
    <div class="dergi-kapsayici" id="icerik">
        <img src="hikaye_sayfa1_imzali.png" alt="Bu Hikayenin Sonu Sayfa 1" class="dergi-sayfa">
        <img src="hikaye_sayfa2_imzali.png" alt="Bu Hikayenin Sonu Sayfa 2" class="dergi-sayfa">
    </div>

    <div class="footer">
        © Dijital Edebiyat Dergisi - Tüm Hakları Saklıdır.
    </div>

    <script>
        const icerik = document.getElementById('icerik');

        // 1. Sağ Tık Menüsünü Engelleme
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Klavye Kısayollarını, F12 ve Ekran Görüntüsü Tuşlarını Engelleme/Bulanıklaştırma
        document.addEventListener('keydown', function(e) {
            // F12 Engeli
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }

            // PrintScreen veya Windows + Shift + S kısayolu yakalama
            if (e.key === 'PrintScreen' || (e.key === 'S' && e.shiftKey && (e.metaKey || e.windowsKey))) {
                icerik.classList.add('blur-mode');
                setTimeout(() => {
                    icerik.classList.remove('blur-mode');
                }, 3000);
            }

            // Ctrl+C, Ctrl+P, Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+C Kombinasyonları
            if (e.ctrlKey || e.metaKey) {
                if (['c', 'p', 'u', 's', 'C', 'P', 'U', 'S'].includes(e.key) || 
                   (e.shiftKey && ['I', 'i', 'C', 'c', 'J', 'j', 'S', 's'].includes(e.key))) {
                    e.preventDefault();
                    icerik.classList.add('blur-mode');
                    setTimeout(() => {
                        icerik.classList.remove('blur-mode');
                    }, 2000);
                    return false;
                }
            }
        });

        // PrintScreen Tuşu Bırakıldığında Kopyalama Panosunu Temizleme Girişimi
        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen') {
                icerik.classList.add('blur-mode');
                setTimeout(() => {
                    icerik.classList.remove('blur-mode');
                }, 3000);
            }
        });

        // 3. Odak Kaybında (Pencere Değişimi veya Ekran Alıntısı Aracı Açıldığında) Bulanıklaştırma
        window.addEventListener('blur', function() {
            icerik.classList.add('blur-mode');
        });

        window.addEventListener('focus', function() {
            icerik.classList.remove('blur-mode');
        });

        // 4. Görsellerin Sürüklenmesini Engelleme
        document.querySelectorAll('.dergi-sayfa').forEach(img => {
            img.addEventListener('dragstart', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
