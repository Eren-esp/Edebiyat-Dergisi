    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #2b2b2b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: filter 0.3s ease;
        }

        body.blur-content {
            filter: blur(15px);
        }

        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "TELİFLİ İÇERİK - İNDİRİLEMEZ";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 26px;
            color: rgba(0, 0, 0, 0.035);
            white-space: nowrap;
            pointer-events: none;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 10px;
            color: #8b0000;
            margin-top: 0;
        }

        .meta-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            font-style: italic;
        }

        p {
            line-height: 1.8;
            font-size: 17px;
            text-align: justify;
            margin-bottom: 18px;
            text-indent: 20px;
        }

        .author-tag {
            text-align: right;
            font-weight: bold;
            color: #8b0000;
            margin-top: 30px;
            font-style: italic;
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>

                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))

            document.body.classList.add('blur-content');
        });

        window.addEventListener('focus', function() {
            document.body.classList.remove('blur-content');
        });
