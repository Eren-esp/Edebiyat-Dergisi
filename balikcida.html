<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balıkçıda - Edebiyat Dergisi</title>
    <style>
        body {
            background-color: #f4f1ea;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: filter 0.3s ease;
        }

        body.blur-content {
            filter: blur(15px);
        }

        .image-container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-radius: 8px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            /* Resmin sürüklenmesini ve mouse ile etkileşimini engeller */
            pointer-events: none; 
            -webkit-user-drag: none;
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="image-container">
        <!-- Buraya yüklediğin resmin tam adını yazmalısın -->
        <img src="balikcida.png" alt="Balıkçıda Metni">
    </div>

    <script>
        // Kısayolları ve Geliştirici Araçlarını Engelle
        document.addEventListener('keydown', function(e) {
            if (
                e.ctrlKey && (e.key === 'c' || e.key === 'p' || e.key === 's' || e.key === 'u') ||
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
            ) {
                e.preventDefault();
                alert("Bu içeriğin indirilmesi veya kopyalanması telif hakları gereği kısıtlanmıştır.");
            }
        });

        // Ekran Alıntısı Aracı veya Sekme Değişiminde Bulanıklaştır
        window.addEventListener('blur', function() {
            document.body.classList.add('blur-content');
        });

        window.addEventListener('focus', function() {
            document.body.classList.remove('blur-content');
        });
    </script>
</body>
</html>
